apiVersion: apps/v1
kind: Deployment

metadata:
  name: transunion-dashboard
  labels:
    app: transunion-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: transunion-dashboard

  template:
    metadata:
      labels:
        app: transunion-dashboard

    spec:
      containers:
      - name: transunion-dashboard

        image: slpatil2511/transunion-dashboard:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8501

        env:
        - name: ATLASSIAN_EMAIL
          valueFrom:
            secretKeyRef:
              name: noc-dashboard-secret
              key: ATLASSIAN_EMAIL

        - name: ATLASSIAN_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: noc-dashboard-secret
              key: ATLASSIAN_API_TOKEN

        - name: ATLASSIAN_TOKEN_EXPIRY
          valueFrom:
            secretKeyRef:
              name: noc-dashboard-secret
              key: ATLASSIAN_TOKEN_EXPIRY

        - name: TEAMS_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: noc-dashboard-secret
              key: TEAMS_WEBHOOK_URL

        - name: AURA_API_KEY
          valueFrom:
            secretKeyRef:
              name: noc-dashboard-secret
              key: AURA_API_KEY

        - name: AURA_BASE_URL
          valueFrom:
            secretKeyRef:
              name: noc-dashboard-secret
              key: AURA_BASE_URL

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"

          limits:
            memory: "2Gi"
            cpu: "1000m"

        readinessProbe:
          httpGet:
            path: /
            port: 8501

          initialDelaySeconds: 30
          timeoutSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8501

          initialDelaySeconds: 60
          timeoutSeconds: 5